<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم — Zyad Ibrahim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1110;--panel:#161917;--card:#1b1f1c;--line:rgba(255,255,255,.09);--green:#10A861;--green2:#1fd17e;--gdim:rgba(16,168,97,.15);--text:#fff;--muted:#9aa39e;--red:#ff6b6b;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Tajawal','Montserrat',system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--green2)}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}
.brand svg{width:34px;height:34px;filter:drop-shadow(0 0 6px rgba(31,209,126,.5))}
/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(15,17,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.dirty{font-size:13px;font-weight:700;color:#ffcc66;display:none}
.dirty.on{display:inline}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid var(--line);transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--green)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green2)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,.35)}
.btn:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}
.side{border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.side button{text-align:start;padding:11px 14px;border-radius:12px;font-weight:700;color:var(--muted);display:flex;gap:10px;align-items:center}
.side button:hover{background:rgba(255,255,255,.04);color:#fff}
.side button.on{background:var(--gdim);color:var(--green2)}
.side .badge{margin-inline-start:auto;background:var(--green);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.main{padding:26px clamp(14px,3vw,40px) 120px;max-width:1100px;width:100%}
.main h1{font-size:26px;font-weight:800;margin-bottom:6px}
.main .sub{color:var(--muted);margin-bottom:24px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:sticky;top:58px;height:auto;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px;background:var(--bg);z-index:15}.side button{white-space:nowrap;padding:8px 12px}.top .hide-m{display:none}}
/* fields */
.f{display:grid;gap:6px;margin-bottom:14px}
.f>label,.flab{font-weight:700;font-size:13px;color:#cfd6d2}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=url],input[type=password],input[type=email],select,textarea{width:100%;background:#0b0d0c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:76px}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bi>div{display:grid;gap:4px}
.bi small{font-size:11px;color:var(--muted);font-weight:700}
.bi [dir=ltr]{text-align:left}
@media(max-width:700px){.bi{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--green)}
/* cards / repeater */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card.off{opacity:.55}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.chead .ttl{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#000;flex:none}
.chead .tools{display:flex;gap:4px;flex:none}
.ib{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.ib:hover{color:#fff;border-color:var(--line);background:rgba(255,255,255,.04)}
.ib.del:hover{color:var(--red)}
.cbody{padding:4px 16px 16px;border-top:1px solid var(--line)}
.card:not(.open)>.cbody{display:none}
.caret{transition:transform .2s;color:var(--muted)}
.card.open>.chead .caret{transform:rotate(90deg)}
.add{width:100%;border:1.5px dashed rgba(16,168,97,.5);color:var(--green2);border-radius:var(--r);padding:12px;font-weight:800;margin:4px 0 10px}
.add:hover{background:var(--gdim)}
.sub-rep{border-inline-start:2px solid var(--line);padding-inline-start:12px;margin:6px 0 14px}
.sub-rep .card{background:#171a18}
/* images */
.imgf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgf .pv{width:110px;height:76px;border-radius:10px;background:#000 center/contain no-repeat;border:1px solid var(--line);flex:none}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs .it{position:relative;width:130px;height:90px;border-radius:10px;background:#000 center/cover no-repeat;border:1px solid var(--line)}
.imgs .it .acts{position:absolute;inset:auto 4px 4px 4px;display:flex;justify-content:space-between}
.imgs .it .acts button{background:rgba(0,0,0,.75);border-radius:7px;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.imgs .up{width:130px;height:90px;border-radius:10px;border:1.5px dashed rgba(16,168,97,.5);color:var(--green2);font-weight:800;display:grid;place-items:center;text-align:center;font-size:13px}
/* sections list */
.sec{display:flex;align-items:center;gap:10px}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--muted)}
.tag.g{background:var(--gdim);color:var(--green2)}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#333;border-radius:99px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;top:3px;inset-inline-start:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span:before{transform:translateX(-18px)}
html[dir=ltr] .sw input:checked+span:before{transform:translateX(18px)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:20px}
.modal .box{width:min(860px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
.tpl{text-align:start;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);transition:all .2s;display:grid;gap:10px}
.tpl:hover{border-color:var(--green);transform:translateY(-3px)}
.tpl .mini{height:92px;border-radius:10px;background:#0b0d0c;border:1px solid var(--line);padding:10px;display:flex;gap:6px;align-items:stretch;overflow:hidden}
.tpl .mini i{display:block;background:rgba(16,168,97,.35);border-radius:4px}
.tpl b{font-size:16px}.tpl span{color:var(--muted);font-size:13px;line-height:1.5}
/* leads */
.ltable{width:100%;border-collapse:collapse;font-size:14px}
.ltable th,.ltable td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.ltable th{color:var(--muted);font-size:12px;font-weight:800}
.ltable select{padding:6px 8px;width:auto}
.st-pending{color:#ffcc66}.st-approved{color:var(--green2)}.st-hidden{color:var(--muted)}.card.pend{border-color:rgba(255,204,102,.45)!important}
.st-new{color:#ffcc66}.st-won{color:var(--green2)}.st-lost{color:var(--red)}
.lcards{display:none}
@media(max-width:860px){.ltable{display:none}.lcards{display:block}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140%);background:#1f2a23;border:1px solid var(--green);padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;transition:transform .35s}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red)}
.box2{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.box2 h3{font-size:17px;margin-bottom:10px}
pre.code{background:#0b0d0c;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;direction:ltr;text-align:left;max-height:260px;white-space:pre}
.evt{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:14px}
.evt code{direction:ltr;color:var(--green2);font-weight:700}
.search{max-width:320px;margin-bottom:16px}
.loading{padding:60px;text-align:center;color:var(--muted)}
/* ===== Glass theme ===== */
:root{--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.07);--gline:rgba(255,255,255,.12);--blur:blur(18px) saturate(160%)}
html{background:#070908}
body{background:transparent;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
 background:radial-gradient(34% 30% at 22% 28%,rgba(16,168,97,.55),transparent 70%),
 radial-gradient(28% 26% at 70% 18%,rgba(31,209,126,.32),transparent 70%),
 radial-gradient(36% 34% at 62% 72%,rgba(16,168,97,.42),transparent 70%),
 radial-gradient(24% 22% at 15% 85%,rgba(120,255,190,.18),transparent 70%),
 radial-gradient(20% 18% at 90% 50%,rgba(31,209,126,.22),transparent 70%),#070908;
 filter:blur(10px);animation:glassdrift 26s ease-in-out infinite alternate}
@keyframes glassdrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-3%,2%,0) scale(1.06)}100%{transform:translate3d(2%,-2%,0) scale(1.02)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.login form,.top,.side,.card,.box2,.modal .box,.tpl,.toast{
 background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
 -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
 border:1px solid var(--gline);
 box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.top{background:rgba(10,14,12,.45);border-width:0 0 1px 0;box-shadow:0 6px 30px rgba(0,0,0,.25)}
.side{background:rgba(255,255,255,.025);border-width:0;border-inline-end:1px solid var(--gline);box-shadow:none}
.login form{border-radius:26px;padding:38px}
.card{border-radius:18px}
.box2{border-radius:20px}
.sub-rep .card{background:rgba(255,255,255,.035)}
.modal{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{border-radius:26px}
.tpl:hover{border-color:rgba(31,209,126,.6);box-shadow:0 14px 40px rgba(16,168,97,.18),inset 0 1px 0 rgba(255,255,255,.15)}
.tpl .mini{background:rgba(0,0,0,.25);border-color:var(--gline)}
input[type=text],input[type=number],input[type=url],input[type=password],input[type=email],select,textarea,pre.code{
 background:rgba(0,0,0,.28);border-color:var(--gline);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
input:focus,select:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(31,209,126,.15)}
select option{background:#121614}
.btn{background:rgba(255,255,255,.04);border-color:var(--gline);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.pri{background:linear-gradient(135deg,rgba(31,209,126,.95),rgba(16,168,97,.9));border-color:rgba(255,255,255,.18);box-shadow:0 6px 22px rgba(16,168,97,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.pri:hover{background:linear-gradient(135deg,#2ee08c,#14b86b)}
.side button.on{background:rgba(16,168,97,.18);box-shadow:inset 0 0 0 1px rgba(31,209,126,.35)}
.side button:hover{background:rgba(255,255,255,.06)}
.add{background:rgba(16,168,97,.06)}
.imgf .pv,.imgs .it{border-color:var(--gline)}
.toast{background:rgba(20,30,24,.6)}
.ltable th,.ltable td{border-bottom-color:var(--gline)}
@media(max-width:860px){.side{background:rgba(10,14,12,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-inline-end:0;border-bottom:1px solid var(--gline)}}
</style>

<script>
(function(){
const CFG = window.ZI_CONFIG;
const sb = supabase.createClient(CFG.url, CFG.key);
const $ = (s,el=document)=>el.querySelector(s);
const h = (tag, attrs={}, ...kids)=>{ const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){ if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(k==='html') e.innerHTML=v; else e.setAttribute(k, v===true?'':v); }
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e; };
const toast=(m,err)=>{const t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));

let D=null, dirty=false, tab='sections';
function setDirty(v=true){ dirty=v; $('#dirty').classList.toggle('on',v); $('#saveBtn').disabled=!v; }
addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ======================= field engine ======================= */
const bi = v => (v && typeof v==='object') ? v : {en:'',ar:''};
function fBi(obj,k,label,{area=false,hint}={}){
  obj[k]=bi(obj[k]);
  const mk=(lang)=>{ const el=h(area?'textarea':'input',{type:'text',dir:lang==='ar'?'rtl':'ltr',rows:area?4:null});
    el.value=obj[k][lang]||''; el.oninput=()=>{obj[k][lang]=el.value;setDirty()}; return el; };
  return h('div',{class:'f'},h('label',{},label),h('div',{class:'bi'},h('div',{},h('small',{},'عربي'),mk('ar')),h('div',{},h('small',{},'English'),mk('en'))),hint?h('div',{class:'hint'},hint):null);
}
function fText(obj,k,label,{type='text',hint,dir,ph,onchange}={}){
  const el=h('input',{type,dir,placeholder:ph}); el.value=obj[k]??'';
  el.oninput=()=>{ obj[k]= type==='number' ? (el.value===''?0:+el.value) : el.value; setDirty(); onchange&&onchange(); };
  return h('div',{class:'f'},h('label',{},label),el,hint?h('div',{class:'hint'},hint):null);
}
function fCheck(obj,k,label,onchange){
  const el=h('input',{type:'checkbox'}); el.checked=!!obj[k]; el.onchange=()=>{obj[k]=el.checked;setDirty();onchange&&onchange()};
  return h('label',{class:'chk'},el,label);
}
function fSelect(obj,k,label,opts){
  const el=h('select',{},opts.map(([v,t])=>h('option',{value:v},t))); el.value=obj[k]??opts[0][0];
  el.onchange=()=>{obj[k]=el.value;setDirty()}; return h('div',{class:'f'},h('label',{},label),el);
}
function fColor(obj,k,label){
  const c=h('input',{type:'color',style:'width:54px;height:40px;padding:2px;border-radius:10px;background:#0b0d0c;border:1px solid var(--line)'}); c.value=obj[k]||'#ffffff';
  const tx=h('input',{type:'text',dir:'ltr',style:'max-width:120px'}); tx.value=obj[k]||'#ffffff';
  c.oninput=()=>{obj[k]=c.value;tx.value=c.value;setDirty()}; tx.oninput=()=>{obj[k]=tx.value;if(/^#[0-9a-f]{6}$/i.test(tx.value))c.value=tx.value;setDirty()};
  return h('div',{class:'f'},h('label',{},label),h('div',{class:'row'},c,tx));
}
// list of lines {en:[],ar:[]}
function fLines(obj,k,label,hint='كل نقطة في سطر'){
  const v=obj[k]=(obj[k]&&typeof obj[k]==='object')?obj[k]:{en:[],ar:[]};
  const mk=lang=>{const el=h('textarea',{dir:lang==='ar'?'rtl':'ltr',rows:5}); el.value=(v[lang]||[]).join('\n');
    el.oninput=()=>{v[lang]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);setDirty()}; return el;};
  return h('div',{class:'f'},h('label',{},label),h('div',{class:'bi'},h('div',{},h('small',{},'عربي'),mk('ar')),h('div',{},h('small',{},'English'),mk('en'))),h('div',{class:'hint'},hint));
}

/* ---------- images ---------- */
async function compress(file){
  if(file.type==='image/svg+xml' || file.type==='image/gif') return {blob:file, ext:file.type==='image/svg+xml'?'svg':'gif', type:file.type};
  const bmp = await createImageBitmap(file);
  const max=2000, sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob = await new Promise(r=>cv.toBlob(r,'image/webp',0.86));
  if(blob && blob.type==='image/webp') return {blob, ext:'webp', type:'image/webp'};
  const b2 = await new Promise(r=>cv.toBlob(r,'image/png')); return {blob:b2, ext:'png', type:'image/png'};
}
async function uploadFile(file){
  const {blob,ext,type} = await compress(file);
  const path = `${new Date().toISOString().slice(0,7)}/${uid()}.${ext}`;
  const {error} = await sb.storage.from('media').upload(path, blob, {contentType:type, cacheControl:'31536000', upsert:false});
  if(error) throw error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
function pickFiles(multiple){ return new Promise(res=>{ const fi=$('#fileIn'); fi.value=''; fi.multiple=!!multiple; fi.onchange=()=>res([...fi.files]); fi.click(); }); }
async function uploadMany(files){
  const out=[]; let i=0;
  for(const f of files){ i++; toast(`جاري رفع الصورة ${i} من ${files.length}…`); try{ out.push(await uploadFile(f)); }catch(e){ toast('فشل رفع صورة: '+(e.message||e),true); } }

const TABS=[['sections','🧩 أقسام الموقع',viewSections],['cases','📈 دراسات الحالة',viewCases],['clients','🏷 العملاء واللوجوهات',viewClients],['home','✨ الواجهة والأرقام',viewHome],['skills','🛠 الخبرات والمسيرة',viewSkills],['texts','✍️ النصوص',viewTexts],['leads','📥 الطلبات',viewLeads],['reviews','⭐ الريفيوهات',viewReviews],['settings','⚙️ الإعدادات والتتبّع',viewSettings]];
function go(t){ tab=t; document.querySelectorAll('#side button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); (TABS.find(x=>x[0]===t)||TABS[0])[2](); scrollTo(0,0); }
function shell(){
  const side=$('#side'); side.innerHTML='';
  TABS.forEach(([k,l])=>side.append(h('button',{'data-t':k,onclick:()=>go(k)},l,(k==='leads'||k==='reviews')?h('span',{class:'badge',style:'display:none'},'0'):null)));
  go(tab); updateBadge(); updateRevBadge();
}
function normalize(d){
  d=d||{}; d.settings=d.settings||{}; d.ui=d.ui||{};
  for(const k of ['levels','highlights','heroChips','stats','cases','resultsWall','featuredClients','clients','niches','experience','leadership','education','sections']) d[k]=Array.isArray(d[k])?d[k]:[];
  d.skills=d.skills||{}; for(const k of ['core','services','ads','ecom','tools']) d.skills[k]=Array.isArray(d.skills[k])?d.skills[k]:[];
  d.sections.forEach(s=>{ if(TPL[s.type]) s.data=Object.assign(TPL[s.type].make(), s.data||{}); });
  if(!d.sections.some(s=>s.type==='reviews')){ const ci=d.sections.findIndex(x=>x.type==='form'||x.type==='contact'); d.sections.splice(ci<0?d.sections.length:ci,0,{id:'reviews',type:'reviews',visible:false,data:{}}); }
  const rs=d.sections.find(s=>s.type==='reviews'); rs.data=Object.assign(REV_DEFAULT(), rs.data||{});
  return d;
}
async function loadData(){
  const {data,error}=await sb.from('site_content').select('data').eq('id',1).maybeSingle();
  if(error) throw error;
  if(data && data.data) return normalize(data.data);
  const seed = await (await fetch('content.json',{cache:'no-store'})).json();
  const {error:e2}=await sb.from('site_content').insert({id:1,data:seed}); if(e2) throw e2;
  toast('اتعمل أول نسخة من المحتوى'); return normalize(seed);
}
